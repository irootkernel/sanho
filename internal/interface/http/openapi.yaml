openapi: 3.0.0
info:
  title: Kkachi Server API
  version: 1.0.0
  description: API for Kkachi, a central documentation coordination system.
paths:
  /docs/head:
    get:
      summary: Get current HEAD commit hash of docs repository
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  head:
                    type: string
                    description: Commit hash
        '400':
          description: Bad Request (missing project or unknown project)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /docs/snapshot:
    get:
      summary: Get snapshot of docs directory
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name
        - name: commit
          in: query
          required: false
          schema:
            type: string
          description: Commit hash (optional, defaults to HEAD)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    type: string
                  snapshot:
                    type: string
                    description: Base64 encoded tar.gz
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /workspaces/register:
    post:
      summary: Register or update a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - local_path
                - repo_url
                - actor_email
              properties:
                project:
                  type: string
                local_path:
                  type: string
                repo_url:
                  type: string
                actor_email:
                  type: string
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id:
                    type: string
                  current_docs_head:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal_server_error
  /docs/push:
    post:
      summary: Push docs snapshot to repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspace_id
                - base_docs_hash
                - docs_snapshot
                - actor_email
              properties:
                workspace_id:
                  type: string
                base_docs_hash:
                  type: string
                docs_snapshot:
                  type: string
                  description: Base64-encoded tar.gz of docs directory
                actor_email:
                  type: string
      responses:
        '200':
          description: Push result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [updated, nochange, outdated]
                  new_docs_hash:
                    type: string
                  current_docs_hash:
                    type: string
                  error:
                    type: string
        '400':
          description: Bad Request (missing fields, unknown workspace, or unknown commit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        '409':
          description: Conflict (docs repo busy)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                    example: docs_repo_busy
