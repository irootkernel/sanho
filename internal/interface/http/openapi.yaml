openapi: 3.0.0
info:
  title: Kkachi Server API
  version: 1.0.0
  description: API for Kkachi, a central documentation coordination system.
paths:
  /docs/head:
    get:
      summary: Get current HEAD commit hash of docs repository
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  head:
                    type: string
                    description: Commit hash
        '400':
          description: Bad Request (missing project or unknown project)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /docs/snapshot:
    get:
      summary: Get snapshot of docs directory
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project name
        - name: commit
          in: query
          required: false
          schema:
            type: string
          description: Commit hash (optional, defaults to HEAD)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit:
                    type: string
                  snapshot:
                    type: string
                    description: Base64 encoded tar.gz
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /workspaces/register:
    post:
      summary: Register or update a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - local_path
                - repo_url
                - actor_email
              properties:
                project:
                  type: string
                local_path:
                  type: string
                repo_url:
                  type: string
                actor_email:
                  type: string
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id:
                    type: string
                  current_docs_head:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal_server_error
  /docs/push:
    post:
      summary: Push docs snapshot to repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspace_id
                - base_docs_hash
                - docs_snapshot
                - actor_email
              properties:
                workspace_id:
                  type: string
                base_docs_hash:
                  type: string
                docs_snapshot:
                  type: string
                  description: Base64-encoded tar.gz of docs directory
                actor_email:
                  type: string
      responses:
        '200':
          description: Push result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [updated, nochange, outdated]
                  new_docs_hash:
                    type: string
                  current_docs_hash:
                    type: string
                  error:
                    type: string
        '400':
          description: Bad Request (missing fields, unknown workspace, or unknown commit)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        '409':
          description: Conflict (docs repo busy)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                    example: docs_repo_busy
  /state:
    get:
      summary: Get server state (debug/monitoring)
      description: Returns project docs heads and registered workspace summaries
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs_heads:
                    type: object
                    additionalProperties:
                      type: string
                    description: Map of project name to current docs HEAD commit hash
                  workspaces:
                    type: array
                    items:
                      type: object
                      properties:
                        workspace_id:
                          type: string
                        project:
                          type: string
                        docs_repo_id:
                          type: string
                        local_path:
                          type: string
                        repo_url:
                          type: string
                        docs_hash:
                          type: string
                        last_reported_at:
                          type: string
                          format: date-time
                        last_actor_email:
                          type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /projects/{project}:
    delete:
      summary: Delete a project and its docs repo mapping
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project name to delete
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Force delete even if workspaces are registered
      responses:
        '200':
          description: Project deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unknown_project
        '409':
          description: Conflict - project has registered workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: project_has_workspaces
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /projects:
    post:
      summary: Add or update a project to docs repo mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project
                - docs_repo_id
                - docs_repo_url
                - actor_email
              properties:
                project:
                  type: string
                  description: Project name
                docs_repo_id:
                  type: string
                  description: Docs repository identifier
                docs_repo_url:
                  type: string
                  description: Git URL of the docs repository
                actor_email:
                  type: string
                  description: Email of the user performing the action
      responses:
        '200':
          description: Project added/updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Bad Request (invalid input)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

